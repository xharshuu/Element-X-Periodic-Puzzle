<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive 3D Spheres</title>
    <meta name="description" content="Interactive 3D background with floating spheres that react to mouse movement" />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0f0f17;
      }
      
      #root {
        width: 100vw;
        height: 100vh;
      }
      
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        color: white;
        background-color: #0f0f17;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">Loading...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
